name: SDV AI Code CI & AWS S3 Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # ONNX変換・量子化に必要なライブラリ群を一括インストール
          pip install transformers torch accelerate optimum onnx onnxruntime onnxscript

      # --- 1. HMIモデルの量子化 ＆ ONNXエクスポートの実行 ---
      - name: Run HMI Model Quantization & ONNX Export
        run: |
          echo "Running HMI model quantization & ONNX export pipeline..."
          python quantize_model.py

      # --- 2. AWS 認証設定 ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # --- 3. 生成されたすべての成果物をS3に自動アップロード ---
      - name: Upload Artifacts to Amazon S3
        run: |
          echo "Uploading quantized model and ONNX model to S3..."
          
          # output_artifacts/ 内の .pt と .onnx をまとめてS3へ同期
          aws s3 sync output_artifacts/ s3://sdv-ai-edge-artifacts-kcbn-505381157538-ap-southeast-2-an/artifacts/
          
          echo "Successfully uploaded all edge artifacts to Amazon S3!"
