name: HMI Copilot CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check copilot tests dev_platform
      - name: Pytest
        run: python -m pytest -q
      - name: Forbidden-word gate (H3)
        run: python -m copilot.safety
      - name: Copilot scenes
        run: |
          python -m copilot --scene overload
          python -m copilot --scene stable
      - name: Bedrock dry-run
        run: python -m dev_platform --text "少し眠い"
